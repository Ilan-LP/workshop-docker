server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Static files (the React build)
  location / {
    try_files $uri /index.html;
  }

  # Everything under /api/ is forwarded to the "api" service.
  # "api" is resolved by Docker's internal DNS: it is the compose service name.
  location /api/ {
    proxy_pass http://api:3000/;
  }
}
